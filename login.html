<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - RecipeHub</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
<div class="auth-card">
  <a class="logo center" href="index.html">🍴 RecipeHub</a>
  <h1>Welcome back</h1>
  <p class="muted">Login to continue to your recipe dashboard.</p>
  <div id="message" class="message"></div>
  <form id="loginForm">
    <label>Email<input type="email" id="email" required placeholder="Enter your email"></label>
    <label>Password<input type="password" id="password" required placeholder="Enter your password"></label>
    <button class="btn full" type="submit">Login</button>
  </form>
  <div class="demo-box">
    <strong>Demo accounts</strong>
    <p>Admin: admin@recipehub.com / admin123</p>
    <p>User: user@recipehub.com / user123</p>
  </div>
  <p class="auth-link">Don't have an account? <a href="signup.html">Create one</a></p>
</div>
<script src="js/auth.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", loginUser);
</script>
</body>
</html>
